[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dev-guard"
version = "0.1.0"
description = "Deterministic guardrails for coding agents with hook, CLI and advisory MCP interfaces"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
workflow = ["psutil>=7,<8"]

[project.scripts]
dev-guard = "devguard.cli:main"
dev-guard-mcp = "devguard.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
